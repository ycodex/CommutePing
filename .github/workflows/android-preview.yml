name: Build Android preview APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-preview-apk
  cancel-in-progress: false

jobs:
  build:
    name: Sync Maps key and trigger EAS build
    runs-on: ubuntu-latest
    environment: google_map_api_key
    timeout-minutes: 30
    env:
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAP_API_KEY }}

    steps:
      - name: Check required secrets
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$GOOGLE_MAPS_ANDROID_API_KEY" ]]; then
            echo "::error::Missing repository secret GOOGLE_MAP_API_KEY."
            exit 1
          fi
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "::error::Missing repository secret EXPO_TOKEN."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 22.0.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Sync Google Maps key to EAS preview
        shell: bash
        run: >-
          eas env:set
          --name GOOGLE_MAPS_ANDROID_API_KEY
          --value "$GOOGLE_MAPS_ANDROID_API_KEY"
          --environment preview
          --visibility sensitive
          --scope project
          --non-interactive

      - name: Trigger Android preview APK build
        run: eas build --platform android --profile preview --non-interactive --no-wait
