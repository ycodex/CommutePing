name: Build Android preview APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-preview-apk
  cancel-in-progress: false

jobs:
  build:
    name: Sync Maps key and trigger EAS build
    runs-on: ubuntu-latest
    environment: google_map_api_key
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAP_API_KEY }}

    steps:
      - name: Check required secrets
        shell: bash
        run: |
          if [[ -z "$GOOGLE_MAPS_ANDROID_API_KEY" ]]; then
            echo "::error::Missing repository secret GOOGLE_MAP_API_KEY."
            exit 1
          fi
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "::error::Missing repository secret EXPO_TOKEN."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Google Maps key to EAS preview
        shell: bash
        run: >-
          npx --yes eas-cli@22.0.0 env:set
          --name GOOGLE_MAPS_ANDROID_API_KEY
          --value "$GOOGLE_MAPS_ANDROID_API_KEY"
          --environment preview
          --visibility sensitive
          --scope project
          --non-interactive

      - name: Trigger Android preview APK build
        run: >-
          npx --yes eas-cli@22.0.0 build
          --platform android
          --profile preview
          --non-interactive
          --no-wait
